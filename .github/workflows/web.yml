name: web

on:
  push:
    branches: [main]
    paths: ['frontend-vue/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['frontend-vue/**', '.github/workflows/web.yml']

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json's "packageManager" field, so
      # CI and local resolve identically (avoids pnpm-major lockfile drift).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend-vue/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-vue/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
