name: perf

permissions:
  contents: read

# Nightly performance pass: boots the compose bundle from this branch, seeds
# the ~100k-item perf organization, runs the k6 scripts in perf/ against it, and dumps
# the top queries from pg_stat_statements. A failed threshold fails the job (k6 exits
# non-zero); the summaries and the dump are uploaded either way.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The api image bundles the SPA, so the web toolchain is part of building it.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend-vue/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-vue/pnpm-lock.yaml

      - name: Write .env
        working-directory: deploy
        run: |
          set -euo pipefail
          # Written before the images are built: without it `docker compose` cannot even
          # interpolate the file, so a build failure would take the log dump and the
          # teardown down with it and hide its own cause.
          # Same shape as .env.example, with generated secrets; nothing is reused and the
          # stack is destroyed at the end of the job.
          cat > .env <<EOF
          AICTIQ_URL=http://localhost:8080
          HTTP_PORT=8080
          HTTPS_PORT=8443
          JWT_KEY=$(openssl rand -base64 48)
          POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 24)
          POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)
          GARAGE_RPC_SECRET=$(openssl rand -hex 32)
          GARAGE_ADMIN_TOKEN=$(openssl rand -hex 32)
          S3_ACCESS_KEY=GK$(openssl rand -hex 12)
          S3_SECRET_KEY=$(openssl rand -hex 32)
          S3_BUCKET=aictiq
          GARAGE_CAPACITY_BYTES=1073741824
          SEED_ADMIN_EMAIL=admin@example.com
          SEED_ADMIN_PASSWORD=$(openssl rand -base64 24)
          AICTIQ_IMAGE_REGISTRY=aictiq-local
          AICTIQ_IMAGE_TAG=local
          AICTIQ_IMAGE_PULL_POLICY=never
          AICTIQ_SUBNET=10.89.7.0/24
          CADDY_IP=10.89.7.10
          # The nightly drives ~20 req/s from one runner address; the shipped global
          # guard (300/min per address) would 429 it into a fake pass. MCP limits stay
          # stock - perf/mcp.js paces itself under the 60/min tool budget.
          RATE_LIMITING_GLOBAL_PER_MINUTE=9000
          EOF

      - name: Build images from this branch
        working-directory: deploy
        run: ./build-local.sh

      - name: Validate the compose file
        working-directory: deploy
        run: docker compose config >/dev/null

      - name: Start the stack
        working-directory: deploy
        run: docker compose up -d --wait --wait-timeout 300

      - name: Wait for readiness
        working-directory: deploy
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then
              echo "ready after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "the API never became ready" >&2
          exit 1

      - name: Seed the perf organization
        working-directory: deploy
        run: |
          set -euo pipefail
          # aictiq-seed-perf seeds org "perf" (20 projects, ~100k items) and exits; the
          # log is the progress record and lands in the artifact.
          docker compose run --rm api aictiq-seed-perf 2>&1 | tee /tmp/aictiq-seed-perf.log

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Reset pg_stat_statements
        working-directory: deploy
        run: docker compose exec -T postgres psql -U aictiq_admin -d aictiq -c 'SELECT pg_stat_statements_reset();'

      - name: Run k6 scripts
        run: |
          set -euo pipefail
          mkdir -p perf/results
          export BASE_URL=http://localhost:8080
          export ORG_SLUG=perf
          export ADMIN_EMAIL="$(sed -n 's/^SEED_ADMIN_EMAIL=//p' deploy/.env)"
          export ADMIN_PASSWORD="$(sed -n 's/^SEED_ADMIN_PASSWORD=//p' deploy/.env)"
          test -n "$ADMIN_EMAIL" && test -n "$ADMIN_PASSWORD"
          for script in list board search detail mcp; do
            echo "::group::k6 run perf/${script}.js"
            k6 run "perf/${script}.js"
            echo "::endgroup::"
          done

      - name: Dump top queries from pg_stat_statements
        working-directory: deploy
        run: |
          set -euo pipefail
          mkdir -p ../perf/results
          docker compose exec -T postgres psql -U aictiq_admin -d aictiq -P pager=off -c "
            SELECT calls,
                   round(total_exec_time::numeric, 1) AS total_ms,
                   round(mean_exec_time::numeric, 2) AS mean_ms,
                   rows,
                   left(regexp_replace(query, E'[\\n\\r\\t]+', ' ', 'g'), 200) AS query
            FROM pg_stat_statements
            ORDER BY total_exec_time DESC
            LIMIT 10" | tee ../perf/results/pg_stat_statements-top10.txt

      - name: Collect the seed log
        if: always()
        run: |
          set -euo pipefail
          mkdir -p perf/results
          cp /tmp/aictiq-seed-perf.log perf/results/ 2>/dev/null || true

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: |
            perf/results/*.json
            perf/results/*.txt
            perf/results/*.log
          retention-days: 14
          if-no-files-found: error

      - name: Dump logs on failure
        if: failure()
        working-directory: deploy
        # Best effort: the step exists to explain an earlier failure, never to add one.
        run: docker compose logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v || true
