# pnpm 11 reads its settings from here rather than from .npmrc or package.json.

# Install scripts are opt-in. esbuild and unrs-resolver unpack platform binaries
# (Vite and ESLint fail without them) and vue-demi patches itself for the installed Vue
# major (@vueuse/core needs it). Nothing else may run scripts on install.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  vue-demi: true

# Don't pull a package version published in the last two days - the window in which
# most npm supply-chain compromises are caught and unpublished.
minimumReleaseAge: 2880

# Advisories pnpm audit skips. Each entry needs a reason and is dropped once a fix ships.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion on deeply nested brace patterns; no patched release
    # yet. It is reached only through dev tooling (shadcn-vue's CLI and the ESLint
    # TypeScript config, via fast-glob/micromatch), which expands our own fixed globs and
    # never untrusted input, and none of it ships in the bundle.
    - GHSA-vfj7-8cjw-p6xm
